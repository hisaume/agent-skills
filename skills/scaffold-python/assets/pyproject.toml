[project]
name = "@@DISTRIBUTION@@"
version = "0.0.1"
requires-python = ">=@@MINOR@@"
dependencies = []

[project.scripts]
"@@DISTRIBUTION@@" = "@@PACKAGE@@.__main__:main"

[build-system]
requires = ["uv_build==@@BACKEND@@"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy==@@MYPY@@",
    "pytest==@@PYTEST@@",
    "ruff==@@RUFF@@",
]

[tool.uv.build-backend]
module-name = "@@PACKAGE@@"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
